ontology_schema:
  name: DecisionLedgerRow
  description: A single immutable, replay-stable entry in the passive Jev/Laya decision
    ledger, harvested from committed sandbox transcripts and PC lane reports, recording
    a decision point, its canonicalized bounded state, the incumbent answer, and its
    provenance.
  fields:
  - name: row_id
    type: string
    description: The row's stable identity, derived deterministically so a replay
      of the same committed sources reproduces it exactly
    required: true
  - name: row_type
    type: string
    description: Closed question type, e.g. v1.finding_class, b1.finding_sev, ap.violates_row,
      wf.drift
    required: true
  - name: state
    type: object
    description: The bounded, closed per-type extraction that is canonicalized before
      hashing; never verbatim free text
    required: true
  - name: state_digest
    type: string
    description: Hash of the canonicalized state, stable when the same decision point
      re-lands under a different commit or a compacted transcript
    required: true
  - name: incumbent_answer
    type: string
    description: The answer the existing system produced for this decision point,
      harvested from the committed source
    required: true
  - name: source_kind
    type: string
    description: 'Which first-class workflow the row came from: sandbox Claude Code
      transcript JSONL or PC Qwen builder lane report'
    required: true
  - name: source_ref
    type: string
    description: Repo-relative committed source reference the row was harvested from
    required: true
  - name: redactions
    type: array
    description: The classes stripped during canonicalization (line numbers, timestamps,
      absolute paths, run ids)
    required: true
  - name: captured_only
    type: boolean
    description: True for types admitted as capture-only, whose rows are recorded
      but not answered or consumed
    required: true
evaluation_principles:
- name: Replay determinism
  description: Harvesting the same committed sources twice produces a byte-identical
    ledger; identity and digests do not drift with commit SHA, timestamps, or transcript
    compaction
  weight: 1.0
- name: Advisory containment
  description: No Laya or Jev term appears in any gate, lint, commit, push, or proof
    predicate, and the screen mechanizes this rather than documenting it
  weight: 1.0
- name: Closed schemas
  description: Every row type has a closed state schema, a closed vocabulary, and
    exact error strings, with no open-ended free-text capture
  weight: 0.9
- name: Negative-control discipline
  description: Each increment ships a negative control that fails for the exact expected
    reason, including a planted violation in a real gate file
  weight: 0.9
- name: Boundary fidelity
  description: Changes stay inside the declared J1 file boundary; no model, service,
    hook seam, or consumer is introduced
  weight: 0.9
- name: LLM-free spine
  description: Canonicalization, hashing, harvest, and the screen are deterministic
    code with no model judgment anywhere in the path
  weight: 1.0
- name: Evidence honesty
  description: The J0 report states measured per-venue numbers and venue disagreement
    plainly, and records NOT-run or NOT-built items explicitly
  weight: 0.8
exit_conditions:
- name: J1 ledger complete
  description: The passive decision ledger, harvest, and screen are committed inside
    the declared boundary with deterministic tests green
  criteria: All J1 acceptance criteria pass, the full suite is green, and no file
    outside the declared boundary changed
- name: J0 probe filed
  description: The latency and determinism probe report is committed for both venues
  criteria: docs/research/findings/LAYA-PROBE-1.md exists with per-venue p50/p95,
    determinism verdict, checkpoint pin, and settings, by 2026-09-29
- name: Advisory rule mechanized
  description: The exclusion screen is wired into pre-commit and proven by a planted-violation
    negative control
  criteria: scripts/no_laya_in_gates.py is invoked by pre-commit and its test suite
    passes including the planted violation case
- name: Schedule boundary reached
  description: J1 has not landed by its committed date
  criteria: 2026-10-06 passes without the J1 acceptance criteria green — surface the
    blocker, do not stub
- name: Scope breach
  description: Work requires a model, service, hook seam, or consumer that J1 explicitly
    excludes
  criteria: Any proposed change adds one of those; stop and surface rather than expanding
    the boundary

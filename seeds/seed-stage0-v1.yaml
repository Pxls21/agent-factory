ontology_schema:
  name: Stage0ProofLedger
  description: 'The domain model for Stage 0 gating: each proof S0-01..S0-12 with
    its wave assignment, classification into one of four proof classes, its deterministic
    assertion list, its spec-time negative control and exact expected failure reason,
    its blocking status with a machine-checkable NOT-run marker, and the separate-denominator
    ledger entry that CI aggregates.'
  fields:
  - name: proof_id
    type: string
    description: Stage 0 proof identifier, S0-01 through S0-12
    required: true
  - name: classification
    type: string
    description: One of execution_proof, conformance_checked_decision, blocked_credential,
      blocked_host
    required: true
  - name: wave
    type: number
    description: 'Execution wave: 0 for capability spikes, 1 for S0-01/02/07 plus
      decision shells, 2 for spine S0-03/04/05, 3 for S0-11'
    required: true
  - name: assertions
    type: array
    description: Deterministic LLM-free assertions the proof must satisfy, each independently
      checkable
    required: true
  - name: negative_control
    type: object
    description: The spec-time failing fixture plus its named exact expected_failure_reason,
      colocated so fixture and asserted reason cannot drift
    required: true
  - name: fixture_format
    type: string
    description: 'How the proof''s inputs are materialized: recorded byte-exact transcript
      replayed against a stub, or generated from a pinned schema at test time'
    required: true
  - name: blocked_marker
    type: object
    description: 'For blocked proofs: the recorded failed-attempt probe result, the
      distinction between blocker-absent and blocker-rejecting, and the condition
      that turns the marker RED when the blocker disappears'
    required: true
  - name: ledger_denominator
    type: string
    description: Which denominator this proof counts toward, keeping execution, conformance,
      and blocked totals arithmetically separate
    required: true
  - name: spike_dependency
    type: array
    description: Wave-0 capability spikes whose negative result reclassifies this
      proof as blocked
    required: true
  - name: increment_index
    type: number
    description: Position in the ordered increment list, where one increment is code
      plus deterministic test plus commit
    required: true
  - name: owner_placeholder
    type: string
    description: Placeholder for the out-of-scope human owner (credential owner, gVisor
      host owner, Buzz hosting) rather than an invented resolution
    required: true
evaluation_principles:
- name: Hollow-green impossibility
  description: No proof can report green without the capability it claims actually
    running; every gate ships a negative control that fails for its exact named reason
  weight: 1.0
- name: Denominator separation
  description: The ledger structurally prevents a flat N/12 by keeping execution,
    conformance-decision, and blocked totals in separate arithmetic
  weight: 0.95
- name: Deterministic LLM-free gates
  description: Every assertion resolves by exit code, byte comparison, or set hash;
    no model judgment anywhere in the gate spine
  weight: 0.95
- name: Blocked means fail-closed
  description: A blocked proof records an actual attempted probe distinguishing blocker-absent
    from blocker-rejected, and flips RED the moment the blocker lifts, never becoming
    a permanent excuse
  weight: 0.9
- name: Settled-verdict fidelity
  description: The Seed reproduces the wave-plan-v2 classification, wave ordering,
    and S0-03 model-identity requirement without re-litigating them
  weight: 0.85
- name: Machinery-before-proofs ordering
  description: Shared schemas, runner, ledger generator, CI validator, and mutation
    audit are earlier increments than any proof, and the first commits green on an
    empty artifact set
  weight: 0.8
- name: Honest not-built ledger
  description: The Seed states plainly what is deferred, blocked, or absent instead
    of implying capability that does not exist
  weight: 0.8
exit_conditions:
- name: Seed committed and complete
  description: The Stage 0 Seed YAML exists under seeds/, covers all 12 proofs with
    classifications, assertions, negative controls, ledger denominators, spike contracts,
    fixture formats, and the ordered increment list
  criteria: seeds/seed-stage0-*.yaml is committed and every acceptance criterion above
    passes
- name: Handoff check passes with stage-1 gate RED
  description: The single check that declares the Seed done is the Seed's own self-validation,
    explicitly independent of the stage-1 proof gate, which is RED by design on day
    one
  criteria: Seed self-validation exits 0 while the Stage 0 ledger reports zero landed
    execution proofs without that being treated as failure
- name: Blocker escalation
  description: A Wave-0 spike result or specification conflict would require re-opening
    a settled council decision
  criteria: Stop, name the conflict against wave-plan-v2, and surface it rather than
    deciding unilaterally

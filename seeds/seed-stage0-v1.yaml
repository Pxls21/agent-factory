  owner_placeholder: none
- proof_id: S0-08
  classification: blocked_host
  wave: 2
  increment_index: 17
  ledger_denominator: blocked_capability
  spike_dependency: [runsc]
  fixture_format: containment test SPEC + canary fixtures authored and lint-checked now;

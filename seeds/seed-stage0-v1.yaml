# path persists no file). Known transcription note (not edited in-body to keep
# the record verbatim): the ontology field `fixture_format`'s DESCRIPTION echoes
# the interview question's rejected options ("replayed against a stub, or
# generated from a pinned schema at test time"). The SETTLED decision — binding,

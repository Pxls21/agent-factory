# fixtures authored once from the pinned protocol schema, driving the REAL
# pinned binary (never a stub of the system under test), normalized-then-golden
# transcript comparison with a minimal reviewed volatile-field list, run twice;
# expected_failure_reason lives inside each negative fixture file.
goal: 'Author an implementation-ready Stage 0 Seed for the agent-factory repo that
  specifies the 12 gating proofs (S0-01..S0-12) under the settled wave-plan-v2 council
  verdict: repo layout for proofs/spikes/fixtures/ledger, per-proof assertion lists
  with exact spec-time negative controls, Wave-0 spike output contracts, fixture formats,
  a CI-enforceable ledger format that makes a flat N/12 arithmetically impossible,
  and an ordered increment list where one increment = code + deterministic test +
  commit.'
task_type: code
brownfield_context:
  project_type: brownfield
  context_references:
  - path: /home/user/agent-factory
    role: primary
    summary: Planning-stage repo for the governed agent system; zero application code
      exists, this pass is architecture, contracts, and the staged build plan
  - path: docs/07_BUILD_PLAN.md
    role: primary
    summary: The staged backlog; current gate is that no broad feature work proceeds
      until the Stage 0 proof pack validates the spine, memory composition, Fubuki
      seams, policy failure behavior, and gVisor compatibility
  - path: docs/02_COMPONENT_AUDIT.md
    role: primary
    summary: Verified component inventory; corrects the v2 plan's optimistic claims
      and is read first
  - path: docs/01_ARCHITECTURE.md
    role: reference
    summary: Current architecture plan for the Buzz -> buzz-acp -> Hermes -> OmniRoute
      spine with Fubuki governance and ai-memory scopes
  - path: docs/08_DECISION_LOG.md
    role: reference
    summary: Decisions with their reasons, alongside docs/adr/
  - path: docs/09_PREMORTEM.md
    role: reference
    summary: Failure-mode content informing negative-control design
  - path: upstream.lock.yaml
    role: reference
    summary: Pins the exact upstream commits the component audit inspected
  - path: seeds/
    role: primary
    summary: Destination for the persisted Stage 0 Seed YAML
  - path: docs/archive/v2-original/
    role: reference
    summary: Superseded v2 plan, least reliable, preserved verbatim and corrected
      by current docs
  existing_patterns:
  - One increment = code + deterministic test + commit, with a negative control failing
    for the exact expected reason
  - 'No stubs, no fakes, no shortcuts: surface the blocker instead of minting a hollow
    green, in code and in prose'
  - Gates are deterministic and LLM-free; an LLM enters only at codify or generate
    time, never in gate execution
  - 'Mutation audit every new test suite: inject targeted bugs one at a time, record
    which test kills each, restore from a scratchpad copy, end git-status clean'
  - 'Pipeline order is load-bearing: interview -> SEED -> task-breakdown -> build;
    to-dos come from the seed'
  - Seeds persist to seeds/seed-<name>-vN.yaml and are committed
  - 'Status lines are outcome-first and tagged by verification level: Verified live
    / DONE / NOT built'
  - Upstream components are commit-pinned; the audit doc corrects the archived plan
  - 'Every fail-soft is fail-loud: graceful degradation emits an explicit logged event
    naming what degraded and why'
  - Structured JSON events carry the reason field for every decision, branch, abstain,
    and error until the PandaProbe observability plane lands
  existing_dependencies:
  - Buzz (human-facing client)
  - buzz-acp (ACP bridge)
  - Hermes native ACP server (sole stock production runtime)
  - OmniRoute (all model requests route through it)
  - Fubuki (hash-pinned governance)
  - ai-memory (four logical memory scopes via a first-party composite adapter)
  - gVisor / runsc (containment)
  - Rust 1.95 toolchain (ai-memory build)
  - dockerd (Wave-0 viability spike)
  - veth / netns selective-egress proxy (Wave-0 spike)
  - upstream.lock.yaml pinned upstream commits
  - pytest (deterministic in-sandbox test runner)
  - CI validator over runner-emitted per-proof result artifacts
constraints:
- Zero application code exists in agent-factory today; this Seed is a specification
  deliverable, not a build of the Buzz -> buzz-acp -> Hermes -> OmniRoute spine
- 'The wave-plan-v2 council verdict is SETTLED and must not be re-litigated: four-way
  proof classification, separate ledger denominators, Wave-0 spikes first, then Wave
  1 (S0-01/02/07 + decision shells), Wave 2 spine (S0-03/04/05), Wave 3 (S0-11)'
- Execution proofs are exactly S0-01, S0-02, S0-04, S0-05-mechanism, S0-07, S0-11;
  conformance-checked decisions are exactly S0-09, S0-10, S0-12
- S0-03 is blocked on a real model credential and its pass condition must assert upstream
  model identity, not merely a successful response
- S0-08 is blocked on a gVisor-capable host, with owned procurement and a machine-checkable
  NOT-run marker
- Every proof ships a spec-time negative control that fails for a named exact reason
- All gates are deterministic and LLM-free; no LLM judge anywhere in the gate spine
- Every acceptance criterion is either executable in this environment or explicitly
  deferred with a machine-checkable reason
- Owner questions (credential owner, gVisor host owner, Buzz hosting) are out of scope
  and are represented by placeholders in the Seed
- Upstream components stay commit-pinned via upstream.lock.yaml
- The stage-1 gate is RED by design on day one; a green stage-1 gate is not a completion
  condition for this Seed
- Shared machinery (schemas, runner harness, ledger generator, CI validator, mutation
  audit) is specified as numbered increments preceding any proof increment

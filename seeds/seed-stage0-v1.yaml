# ---------------------------------------------------------------------------
# stage0_proofs — per-proof specification appendix, added in the same
# increment as transcription to satisfy ac_564afc416084c18b (the generated
# body referenced the twelve proofs collectively; this section carries the
# per-proof content, matching the ontology_schema above). Sources:
# docs/03_INTEGRATION_CONTRACTS.md acceptance tests, docs/05_SECURITY.md §8,
# COUNCIL-VERDICT-STAGE0-v1.md, interview interview_20260902_221203 answers.
# ---------------------------------------------------------------------------
stage0_proofs:
- proof_id: S0-01
  classification: execution_proof
  wave: 1
  increment_index: 7
  ledger_denominator: execution
  spike_dependency: []
  fixture_format: committed canonical ACP fixtures (authored once from the pinned protocol
    commit, schema-validated, frozen) driving the REAL pinned hermes-acp launched by the
    real buzz-acp; normalized-then-golden transcript compare (declared minimal volatile-field
    list), run twice byte-identical
  assertions:
  - initialize handshake returns the pinned protocol's required capability fields
  - a prompt turn streams updates and reaches a terminal result state
  - cancellation mid-turn yields the protocol's cancelled terminal state and no orphan process
  - clean shutdown exits 0 with the session closed
  - thread-to-session mapping holds with no collision across two concurrent fixture users
  - BUZZ_ACP_IDLE_TIMEOUT=900 and max turn duration are observed (config echo asserted)
  negative_control:
    fixture: fixtures/s0-01/neg-malformed-initialize.json
    expected_failure_reason: 'protocol-violation: missing required initialize field'
  owner_placeholder: none
- proof_id: S0-02
  classification: execution_proof
  wave: 1
  increment_index: 8
  ledger_denominator: execution
  spike_dependency: []
  fixture_format: four SEPARATE committed negative Buzz-event fixtures plus one positive,
    each negative carrying its own expected_failure block in-file
  assertions:
  - an allowed fresh signed event produces exactly one ACP session/turn
  - membership removal or key rotation revokes access independent of NIP-OA created_at
  - restart/duplicate delivery does not duplicate a completed turn (idempotency by event id)
  negative_control:
    fixtures:
    - {fixture: fixtures/s0-02/neg-unauthorized.json, expected_failure_reason: 'denied: sender-not-in-allowlist'}
    - {fixture: fixtures/s0-02/neg-bad-signature.json, expected_failure_reason: 'denied: signature-invalid'}
    - {fixture: fixtures/s0-02/neg-replayed.json, expected_failure_reason: 'denied: event-replayed'}
    - {fixture: fixtures/s0-02/neg-stale.json, expected_failure_reason: 'denied: event-stale'}
    rule: four DISTINCT reasons required; one blanket rejection fails the proof
  owner_placeholder: none
- proof_id: S0-03
  classification: blocked_credential
  wave: 2
  increment_index: 14
  ledger_denominator: blocked_external_input
  spike_dependency: []
  fixture_format: live round trip only — the S0-04 deterministic stub is FORBIDDEN here
  assertions:
  - a /v1/responses request through real OmniRoute streams text and completes a real
    Hermes tool-call round trip
  - the pass asserts upstream model identity (response model id + non-stub fingerprint),
    never a bare 200
  - Hermes holds no upstream provider key (env assertion) and OmniRoute failure does not
    trigger direct fallback
  negative_control:
    kill_switch: disable the credential -> the proof goes RED
    expected_failure_reason: 'blocked: credential_absent'
  blocked_marker:
    probe: secret-presence check, then (only when present) one authenticated no-op via OmniRoute
    reason_enum: [credential_absent, credential_rejected]
    rule: credential_rejected maps to proof-RED, never to blocked; probe re-runs every CI
      execution; probe success flips the deferral RED (deferral_expired)
    unblock_condition: 'secret OMNIROUTE_UPSTREAM_KEY present and accepted'
  owner_placeholder: TBD-owner-credential
- proof_id: S0-04
  classification: execution_proof
  wave: 2
  increment_index: 15
  ledger_denominator: execution
  spike_dependency: []
  fixture_format: deterministic stub UPSTREAM (the one sanctioned boundary instrument)
    behind REAL OmniRoute; committed request fixtures
  assertions:
  - the Hermes-side request carries 'x-omniroute-compression: off'
  - the response carries the X-OmniRoute-Compression header reporting off
  - the stub upstream's received request byte-compares equal to the sent fixture
    (request preservation)
  negative_control:
    mutation: mutate OmniRoute's real header-set path in the mutation audit -> proof RED
    expected_failure_reason: 'compression-header-missing'
  owner_placeholder: none
- proof_id: S0-05
  classification: execution_proof
  wave: 2
  increment_index: 16
  ledger_denominator: execution
  spike_dependency: [selective-egress]
  fixture_format: paired positive/negative egress probes from inside the contained unit;
    mechanism spike artifact at spikes/selective-egress
  assertions:
  - 'mechanism (Wave 0, label: mechanism proven, containment unproven): a veth/proxy-shaped
    netns lets the unit reach the OmniRoute endpoint (positive leg) while a model endpoint
    fails with the exact denial reason (negative leg) — bare unshare is proven total-block
    and is NOT acceptable evidence'
  - 'full proof (live units): network canaries FAIL from every non-OmniRoute unit, and each
    canary first proves its positive control (the unit CAN reach its allowed target)'
  negative_control:
    mutation: switch the egress gate off -> the canary suite goes RED
    expected_failure_reason: 'egress-permitted: gate-disabled'
  owner_placeholder: none
- proof_id: S0-06
  classification: execution_proof
  wave: 1
  increment_index: 13
  ledger_denominator: execution
  spike_dependency: [rust-ai-memory]
  fixture_format: committed scope/auth fixtures against a REAL pinned ai-memory instance
    (cargo build from the pinned commit; spike decides venue)
  assertions:
  - the auth tuple (actor/agent/team/project) is validated outside model control
  - merge precedence Agent->Project->Team->Company with deterministic de-duplication
    (same input twice -> byte-identical merged output)
  - writes land only in the explicitly authorized active scope
  - a honeytoken staged in one scope NEVER surfaces in another scope's recall (leak fixture)
  negative_control:
    fixture: fixtures/s0-06/neg-unauthorized-tuple.json
    expected_failure_reason: 'denied: scope-tuple-unauthorized'
  owner_placeholder: none
- proof_id: S0-07
  classification: execution_proof
  wave: 1
  increment_index: 9
  ledger_denominator: execution
  spike_dependency: []
  fixture_format: committed ordered Fubuki source fixtures (clean, violating, violation-after-clean)
  assertions:
  - persona_lint returns the documented violation status regardless of violation ordering

# S0-04 proof-OWNED Hermes provider profile (config-leg source; Option B, owner 2026-09-19).
#
# The config leg reads the `s0-04-omniroute` provider block to prove the compression-off contract
# (docs/03 §2) is expressed in a REAL, valid Hermes profile pointing at the SAME OmniRoute the
# request legs use — `api: http://127.0.0.1:20128/v1`, `key_env: OMNIROUTE_API_KEY` (the NAME only;
# no key value is in this file — the checker's credential screen refuses an inline secret), and
# `discover_models: true` (the same models OmniRoute serves). The compression directive rides the
# provider's `extra_headers`, exactly as the pinned Hermes supports it (task #35, ADR 0002; the
# proven-live proofs/S0-03/hermes/config.yaml uses the identical api/transport/extra_headers shape).
#
# The LIVE mechanism proof is the request legs (A1 sent header, A2 response off; source=request-header
# honoured live, A3 upstream request preserved) captured against real OmniRoute; this file is the
# config-expression half of A1. capture_leg.py reads only the provider block (do_config), so the
# model block is the coherent launchable default, not exercised by S0-04.
model:
  default: agentfactory-build
  provider: custom:s0-04-omniroute
  base_url: http://127.0.0.1:20128/v1
  api_mode: chat_completions
providers:
  s0-04-omniroute:
    api: http://127.0.0.1:20128/v1
    name: S0-04 OmniRoute
    key_env: OMNIROUTE_API_KEY
    default_model: agentfactory-build
    transport: openai_chat
    discover_models: true
    extra_headers:
      x-omniroute-compression: "off"

# Software Bill of Materials — Agent Factory
# Pins are mechanically derived from upstream.lock.yaml (the single source of truth).
# The check_pin_diff.py proof asserts bitwise equality between these pins and the lock file.

snapshot_date: "2026-09-04"

# --- Update procedure ---
# 1. Update the pin in upstream.lock.yaml (the ONLY place a pin is authored).
# 2. Run: python3 proofs/S0-12/check_pin_diff.py
#    The checker will report every SBOM pin that differs from upstream.lock.yaml.
# 3. Copy the new pin from upstream.lock.yaml into this file at the matching entry.
# 4. Re-run the checker — it must exit 0 with "PASS".
# 5. Commit both files in the same commit.


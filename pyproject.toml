[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-factory"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
# A passing test's tmp_path is deleted at its teardown; a failing one's is kept for debugging. Without
# this, tests/test_vendored_manifest.py kept 39 copies of the vendored trees (about 130 MB each) until
# the session ended and filled the sandbox disk on 2026-09-23 (the incident log, AF-AP-125).
tmp_path_retention_policy = "failed"

name: stage0-ci

on:
  push:
    # A push that changes only the transcript digests runs no CI: push_clean follows a clean-tree push
    # with such a sync push, and three of the eleven red runs on 2026-09-23 were these (the owner's
    # inbox). The next code push still checks the whole tree, transcripts included.
    paths-ignore:
      - 'transcripts/**'
  pull_request:
    # The same filter: with a pull request open, a transcripts-only push would otherwise start a pull_request run
    # (VERIFY-CI-GATE F10). scripts/ci_gate.py ignores the same prefix when it asks whether a run is expected.
    paths-ignore:
      - 'transcripts/**'

# A newer push to the same ref cancels the run it supersedes; only the head's verdict matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the ACCEPTED anchor check walks history (ancestry of the signed tag's commit)
          fetch-tags: true   # and verifies the signed accepted/<id> tags (test_proof_status: absent tags read as "PENDING")
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure git identity (test_lane_gate probes git commit-tree, which needs a committer)
        run: |
          git config --global user.email "ci@test"
          git config --global user.name "CI"
      - name: Install dependencies
        run: python -m pip install pyflakes pytest "jsonschema==4.25.1" "rfc3339-validator==0.1.4" "PyYAML>=6.0"
      - name: Provision the pinned fubuki-os (a DECLARED input of the governance tests, scripts/fubuki_pin_sync.sh)
        run: bash scripts/fubuki_pin_sync.sh "$RUNNER_TEMP/fubuki-pin" | tee -a "$GITHUB_ENV"
      - name: Run tests
        env:
          S0_01_VENUE: ci   # the S0-01 real-leg corpus is a DECLARED input: CI declares itself and skips the real-producer tests by declaration (VERIFY-CK11 F13/F16)
        run: python -m pytest tests/ -q
      - name: Lint scripts
        run: python -m pyflakes scripts/validate-ledger scripts/proof-runner
      - name: Lint proofs and tests
        run: python -m pyflakes proofs/S0-01 tests/

  harness-suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the ACCEPTED anchor check walks history (ancestry of the signed tag's commit)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        # PyYAML: harness-ports/bin/lane-profile.sh reads and rewrites the Hermes config.yaml (T92);
        # without it test_lane_profile.sh failed 8 of 9 here while the PC and the sandbox had it.
        run: python -m pip install pyflakes "PyYAML>=6.0"
      - name: Configure git for throwaway repos
        run: |
          git config --global user.email "ci@test"
          git config --global user.name "CI"
      - name: Run harness suites
        run: |
          export AF_VENV="$(python3 -c 'import sys; print(sys.prefix)')"
          bash harness-ports/tests/run-all.sh

  ledger-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the ACCEPTED anchor check walks history (ancestry of the signed tag's commit)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pyflakes pytest "jsonschema==4.25.1" "rfc3339-validator==0.1.4" "PyYAML>=6.0"
      - name: Generate ledger
        run: python scripts/ledger-gen --root .
      - name: Committed ledger equals the regenerated one
        run: git diff --exit-code -- proofs/ledger.json
      - name: Validate ledger integrity
        run: python scripts/validate-ledger integrity --root . --ledger proofs/ledger.json

  stage1-gate:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the ACCEPTED anchor check walks history (ancestry of the signed tag's commit)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pyflakes pytest "jsonschema==4.25.1" "rfc3339-validator==0.1.4" "PyYAML>=6.0"
      - name: Stage 1 gate
        run: |
          set -o pipefail
          python scripts/validate-ledger stage1-gate | tee -a "$GITHUB_STEP_SUMMARY"

  planning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the ACCEPTED anchor check walks history (ancestry of the signed tag's commit)
      - name: Verify planning structure
        run: ./scripts/verify-planning-repo.sh
